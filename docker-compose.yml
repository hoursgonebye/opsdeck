services:
  opsdeck:
    build: .
    container_name: opsdeck
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      # Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      - OPSDECK_TOKEN=${OPSDECK_TOKEN:?set OPSDECK_TOKEN in .env}
      - OPSDECK_TZ=${OPSDECK_TZ:-America/New_York}
      - OPSDECK_MAX_UPLOAD_MB=${OPSDECK_MAX_UPLOAD_MB:-25}
      # Optional: enables in-app mentor verification. Without it,
      # attempts queue for an external agent (Claude Code) instead.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPSDECK_MENTOR_MODEL=${OPSDECK_MENTOR_MODEL:-claude-sonnet-4-6}
      - OPSDECK_NOTES_MIN_CHARS=${OPSDECK_NOTES_MIN_CHARS:-300}
      # How stale a subscribed .ics feed may get before it refetches
      # itself. 0 leaves feeds manual-only.
      - OPSDECK_FEED_SYNC_MINUTES=${OPSDECK_FEED_SYNC_MINUTES:-60}
      # When the mentor's nightly briefing digest is written (local time).
      # Empty disables it.
      - OPSDECK_BRIEFING_TIME=${OPSDECK_BRIEFING_TIME:-23:45}
      # Optional: connects Fitbit / Pixel Watch data via the Google Health
      # API. Left empty the Health tab still works with manual and pushed
      # readings - see .env.example for the Cloud Console setup.
      - OPSDECK_GOOGLE_CLIENT_ID=${OPSDECK_GOOGLE_CLIENT_ID:-}
      - OPSDECK_GOOGLE_CLIENT_SECRET=${OPSDECK_GOOGLE_CLIENT_SECRET:-}
      - OPSDECK_GOOGLE_REDIRECT_URI=${OPSDECK_GOOGLE_REDIRECT_URI:-}
    restart: unless-stopped
