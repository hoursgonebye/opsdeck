<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Deck</title>
<link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>

<!-- Mobile-only top bar. On a phone the sidebar becomes an off-canvas
     drawer, so this is the persistent chrome: menu, brand, profile switch. -->
<header class="mobile-bar" id="mobile-bar">
  <button class="mb-btn" id="mb-menu" aria-label="Menu" aria-expanded="false">
    <span class="mb-burger"></span>
  </button>
  <span class="mb-title" id="mb-title">Today</span>
  <div class="mb-profiles" id="mb-profiles"></div>
</header>
<div class="drawer-backdrop" id="drawer-backdrop"></div>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="brand-mark">&gt;_</span>
      <span class="brand-name">OPS DECK</span>
    </div>

    <div class="profile-bar" id="profile-bar"></div>

    <div class="sidebar-search">
      <input type="text" id="global-search" placeholder="Search…" autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- Nav is rebuilt per-profile by profiles.js (buildNav from the
         profile's enabled_modules). This single item is just a pre-boot
         placeholder / fallback. -->
    <ul class="node-tree" id="node-tree">
      <li data-section="today" class="node active"><span class="node-bullet">├─</span> Today</li>
    </ul>

    <div class="sidebar-foot">
      <button id="notify-btn" class="notify-btn">Enable notifications</button>
      <div id="clock"></div>
    </div>
  </nav>

  <main class="panel" id="panel"></main>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal"></div>
</div>

<!-- The mentor lives in a corner dock, not a tab: available from every
     section, because "ask the mentor" shouldn't mean losing your place. -->
<button class="mentor-fab" id="mentor-fab" title="Mentor" aria-label="Open mentor chat">✦</button>
<div class="mentor-dock" id="mentor-dock" hidden>
  <div class="mentor-dock-head">
    <span class="mentor-dock-title">✦ Mentor</span>
    <span id="chat-status" class="chat-status"></span>
    <button class="btn tiny" id="chat-reset">New</button>
    <button class="icon-btn" id="mentor-close" aria-label="Close">×</button>
  </div>
  <div class="chat-log" id="chat-log"></div>
  <div class="chat-compose">
    <textarea id="chat-input" rows="1"
              placeholder="Ask anything… (Enter to send)"></textarea>
    <button class="btn primary" id="chat-send">Send</button>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script>
  window.OPSDECK = {
    token: {{ api_token | tojson }},
    tz: {{ tz | tojson }}
  };
</script>
<script src="/static/js/core.js?v={{ v }}"></script>
<script src="/static/js/today.js?v={{ v }}"></script>
<script src="/static/js/board.js?v={{ v }}"></script>
<script src="/static/js/calendar.js?v={{ v }}"></script>
<script src="/static/js/routines.js?v={{ v }}"></script>
<script src="/static/js/docs.js?v={{ v }}"></script>
<script src="/static/js/skilltree.js?v={{ v }}"></script>
<script src="/static/js/mentor.js?v={{ v }}"></script>
<script src="/static/js/thm.js?v={{ v }}"></script>
<script src="/static/js/growth.js?v={{ v }}"></script>
<script src="/static/js/chat.js?v={{ v }}"></script>
<script src="/static/js/profiles.js?v={{ v }}"></script>
<script src="/static/js/joint.js?v={{ v }}"></script>
<script src="/static/js/health.js?v={{ v }}"></script>
<script src="/static/js/finance.js?v={{ v }}"></script>
<script src="/static/js/main.js?v={{ v }}"></script>
</body>
</html>
